<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="art-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE" />
      <stop offset="100%" stop-color="#EFE6DA" />
    </linearGradient>
    <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="360" fill="url(#art-bg)" rx="16"/>
  <rect x="20" y="20" width="560" height="320" fill="none" stroke="#D8CEBD" stroke-width="1.2" stroke-dasharray="5 5" rx="10"/>

  <!-- Botanical / Organic Ink Line-Art (reflecting Japanese Zen & fine art) -->
  <g transform="translate(180, 50)" stroke="#2C2825" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main stem -->
    <path d="M120,250 C115,190 125,120 145,50" stroke-width="3"/>
    
    <!-- Leaves Left -->
    <path d="M122,210 C90,195 70,165 85,150 C105,155 118,175 123,195" stroke-width="2" fill="#8C5E3C" fill-opacity="0.15"/>
    <path d="M127,150 C85,130 80,95 105,85 C120,95 125,120 128,135" stroke-width="2" fill="#8C5E3C" fill-opacity="0.2"/>
    <path d="M138,90 C110,65 110,40 128,35 C138,45 138,65 140,80" stroke-width="1.8" fill="#8C5E3C" fill-opacity="0.25"/>

    <!-- Leaves Right -->
    <path d="M125,230 C155,215 175,185 160,170 C140,175 128,195 124,215" stroke-width="2" fill="#4B6B58" fill-opacity="0.15"/>
    <path d="M132,170 C175,150 180,115 155,105 C140,115 135,140 130,155" stroke-width="2" fill="#4B6B58" fill-opacity="0.2"/>
    <path d="M142,110 C170,85 170,60 152,55 C142,65 142,85 140,100" stroke-width="1.8" fill="#4B6B58" fill-opacity="0.25"/>

    <!-- Flower Bud at top -->
    <path d="M145,50 C142,35 155,25 152,15 C145,25 138,35 145,50" stroke-width="2" fill="#BE5B6C" fill-opacity="0.35"/>
  </g>

  <!-- Artistic Japanese Hanko / Stamp Emblem -->
  <g transform="translate(480, 240)">
    <rect width="44" height="44" rx="6" fill="#BE5B6C" />
    <text x="22" y="28" font-family="'Noto Serif Thai', serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ชม</text>
  </g>

  <!-- Typography note -->
  <text x="50" y="70" font-family="'Playfair Display', serif" font-size="22" font-style="italic" fill="#2C2825">Botanical Ink &amp; Patience</text>
  <text x="50" y="95" font-family="'Prompt', sans-serif" font-size="12" fill="#756D63">ชุดภาพวาดลายเส้นสะท้อนสมาธิและธรรมชาติ</text>
  <text x="50" y="295" font-family="'Prompt', sans-serif" font-size="11" fill="#999187">Kanchalika Saisud • Fine Art Collection</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#EFE8DB" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5E3C" />
      <stop offset="100%" stop-color="#6F4628" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bg)" rx="16"/>
  <rect x="15" y="15" width="570" height="330" fill="none" stroke="#DCD2C0" stroke-width="1.5" stroke-dasharray="4 4" rx="12"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="520" height="60" fill="url(#accent)" rx="12"/>
  <text x="70" y="78" font-family="'Prompt', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">ELECTRICAL SAFETY &amp; PROTECTION</text>
  <text x="470" y="76" font-family="'Prompt', sans-serif" font-size="14" fill="#FAF0E6">EED • RMUTI</text>

  <!-- 3 Modular Cards -->
  <!-- Card 1: Circuit Breaker -->
  <g transform="translate(40, 120)">
    <rect width="160" height="180" fill="#FFFFFF" stroke="#E2DAC9" stroke-width="1.5" rx="12"/>
    <circle cx="80" cy="50" r="28" fill="#F4EFE6"/>
    <path d="M80,35 L80,50 L90,55" stroke="#8C5E3C" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M72,60 L88,60" stroke="#8C5E3C" stroke-width="3" stroke-linecap="round"/>
    <text x="80" y="105" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" fill="#2C2825" text-anchor="middle">เบรกเกอร์ตัดไฟ</text>
    <text x="80" y="125" font-family="'Prompt', sans-serif" font-size="11" fill="#756D63" text-anchor="middle">ตัดวงจรอัตโนมัติ</text>
    <text x="80" y="142" font-family="'Prompt', sans-serif" font-size="11" fill="#756D63" text-anchor="middle">เมื่อกระแสเกินพิกัด</text>
    <rect x="30" y="152" width="100" height="16" fill="#F0ECE1" rx="8"/>
    <text x="80" y="164" font-family="'Prompt', sans-serif" font-size="9" font-weight="bold" fill="#8C5E3C" text-anchor="middle">MCB / RCD</text>
  </g>

  <!-- Card 2: Grounding System -->
  <g transform="translate(220, 120)">
    <rect width="160" height="180" fill="#FFFFFF" stroke="#E2DAC9" stroke-width="1.5" rx="12"/>
    <circle cx="80" cy="50" r="28" fill="#F4EFE6"/>
    <!-- Ground symbol -->
    <line x1="80" y1="36" x2="80" y2="52" stroke="#8C5E3C" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="52" x2="95" y2="52" stroke="#8C5E3C" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="58" x2="90" y2="58" stroke="#8C5E3C" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="75" y1="64" x2="85" y2="64" stroke="#8C5E3C" stroke-width="2" stroke-linecap="round"/>
    <text x="80" y="105" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" fill="#2C2825" text-anchor="middle">ระบบสายดิน</text>
    <text x="80" y="125" font-family="'Prompt', sans-serif" font-size="11" fill="#756D63" text-anchor="middle">ป้องกันไฟรั่วลงดิน</text>
    <text x="80" y="142" font-family="'Prompt', sans-serif" font-size="11" fill="#756D63" text-anchor="middle">ปลอดภัยต่อผู้ใช้งาน</text>
    <rect x="30" y="152" width="100" height="16" fill="#F0ECE1" rx="8"/>
    <text x="80" y="164" font-family="'Prompt', sans-serif" font-size="9" font-weight="bold" fill="#8C5E3C" text-anchor="middle">EARTH GROUND</text>
  </g>

  <!-- Card 3: PPE & Insulation -->
  <g transform="translate(400, 120)">
    <rect width="160" height="180" fill="#FFFFFF" stroke="#E2DAC9" stroke-width="1.5" rx="12"/>
    <circle cx="80" cy="50" r="28" fill="#F4EFE6"/>
    <!-- Shield / Protection -->
    <path d="M80,32 C92,32 100,37 100,47 C100,60 80,70 80,70 C80,70 60,60 60,47 C60,37 68,32 80,32 Z" fill="none" stroke="#8C5E3C" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M74,48 L78,52 L87,43" stroke="#8C5E3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="80" y="105" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" fill="#2C2825" text-anchor="middle">อุปกรณ์นิรภัย</text>
    <text x="80" y="125" font-family="'Prompt', sans-serif" font-size="11" fill="#756D63" text-anchor="middle">ถุงมือฉนวน &amp; รองเท้า</text>
    <text x="80" y="142" font-family="'Prompt', sans-serif" font-size="11" fill="#756D63" text-anchor="middle">มาตรฐานความปลอดภัย</text>
    <rect x="30" y="152" width="100" height="16" fill="#F0ECE1" rx="8"/>
    <text x="80" y="164" font-family="'Prompt', sans-serif" font-size="9" font-weight="bold" fill="#8C5E3C" text-anchor="middle">SAFETY FIRST</text>
  </g>
</svg>
